name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Determine semantic version
        id: version
        run: |
          latest_tag=$(git tag --list 'v*' --sort=-version:refname | head -n 1)
          if [ -z "$latest_tag" ]; then
            next_version="v0.1.0"
          else
            core="${latest_tag#v}"
            major="${core%%.*}"
            rest="${core#*.}"
            minor="${rest%%.*}"
            patch="${core##*.}"
            patch=$((patch + 1))
            next_version="v${major}.${minor}.${patch}"
          fi
          echo "version=$next_version" >> "$GITHUB_OUTPUT"

      - name: Create and push tag
        run: |
          git tag "${{ steps.version.outputs.version }}"
          git push origin "${{ steps.version.outputs.version }}"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push backend image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/ease-bill-backend:${{ steps.version.outputs.version }}
            ghcr.io/${{ github.repository_owner }}/ease-bill-backend:latest

      - name: Build and push frontend image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/ease-bill-frontend:${{ steps.version.outputs.version }}
            ghcr.io/${{ github.repository_owner }}/ease-bill-frontend:latest

  notify:
    runs-on: ubuntu-latest
    needs: [build-and-push]
    if: always()
    steps:
      - name: Deployment notification
        run: |
          echo "Deployment for version ${{ needs.build-and-push.outputs.version }} finished with status: ${{ needs.build-and-push.result }}"
          echo "## Deployment" >> "$GITHUB_STEP_SUMMARY"
          echo "- Version: ${{ needs.build-and-push.outputs.version }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- Status: ${{ needs.build-and-push.result }}" >> "$GITHUB_STEP_SUMMARY"
